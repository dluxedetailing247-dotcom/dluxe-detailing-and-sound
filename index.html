<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#090b10">
  <meta name="description" content="D-LUXE DETAILING & SOUND Business Platform">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="D-LUXE">

  <link rel="manifest" href="./manifest.json">

  <title>D-LUXE DETAILING & SOUND</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #090b10;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 17px;
      background: #151922;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid #30394a;
    }

    h1 {
      margin: 0;
      font-size: 20px;
    }

    .tag {
      color: #f5b700;
      font-size: 11px;
      font-weight: bold;
      margin-top: 4px;
    }

    nav {
      padding: 10px;
      background: #0d1119;
      display: flex;
      gap: 7px;
      overflow-x: auto;
    }

    button {
      padding: 10px 13px;
      border: 0;
      border-radius: 10px;
      background: #273043;
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
    }

    .primary,
    .install {
      background: #f5b700;
      color: #111111;
    }

    .install {
      margin-top: 10px;
    }

    main {
      max-width: 1050px;
      margin: auto;
      padding: 16px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
    }

    .card {
      background: #151922;
      border: 1px solid #30394a;
      border-radius: 16px;
      padding: 16px;
    }

    .out,
    .item {
      background: #0b0f16;
      padding: 12px;
      border-radius: 10px;
      margin-top: 10px;
      white-space: pre-line;
      overflow-wrap: break-word;
    }

    label {
      display: block;
      color: #aab3c3;
      font-size: 12px;
      margin: 10px 0 5px;
    }

    input,
    select {
      width: 100%;
      padding: 11px;
      background: #0b0f16;
      color: #ffffff;
      border: 1px solid #394354;
      border-radius: 9px;
    }

    .small {
      font-size: 12px;
      color: #aab3c3;
    }

    .status {
      color: #3ddc97;
      font-size: 12px;
    }

    .error {
      color: #ff7777;
    }

    #installAppBtn[hidden] {
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h1>D-LUXE DETAILING & SOUND</h1>
  <div class="tag">DETAIL • SOUND • STANCE CULTURE 🇿🇦</div>
</header>

<nav>
  <button onclick="showPage('home')">🏠 Dashboard</button>
  <button onclick="showPage('requests')">📨 Requests</button>
  <button onclick="showPage('tools')">🔧 Tools</button>
  <button onclick="showPage('settings')">⚙ Settings</button>
</nav>

<main>

  <!-- HOME -->
  <section id="home" class="page active">
    <div class="grid">

      <div class="card">
        <h2>Business Dashboard</h2>
        <p id="connection" class="status">Starting D-LUXE...</p>
        <div id="summary" class="out">Loading services...</div>

        <button class="primary" onclick="showPage('requests')">
          View client requests
        </button>
      </div>

      <div class="card">
        <h3>📱 D-LUXE Mobile App</h3>

        <p class="small">
          Install D-LUXE for a standalone app experience.
        </p>

        <button id="installAppBtn" class="install" hidden>
          📲 Install D-LUXE App
        </button>

        <p id="installStatus" class="small">
          Checking installation availability...
        </p>
      </div>

    </div>
  </section>

  <!--
